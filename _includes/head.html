<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<title>
  {% if page.title and page.title != site.title %}
    {{ page.title | escape }} | {{ site.title | escape }}
  {% else %}
    {{ site.title | escape }}
  {% endif %}
</title>
<link rel="icon" href="{{ '/images/favicon-light.png' | relative_url }}" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{ '/images/favicon-dark.png' | relative_url }}" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
